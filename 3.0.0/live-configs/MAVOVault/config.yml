# PLAZA PORTALS (ACTIVE - jump into the rooms):
#   1. Stand at the BOTTOM corner of the portal opening: /vaultroom pos1
#   2. Fly to the OPPOSITE TOP corner:                   /vaultroom pos2
#   3. /vaultroom portal vault      (or: portalroom)
# Effects: vault = black veil + white sparkles; portalroom = red veil + yellow
# sparkles. Standing inside: if the player has NOT unlocked the gate, the
# unlock GUI opens (50k/25k one-time). If unlocked: 3s countdown (step-out
# cancels instantly, monsters within 12 blocks block it, creative instant),
# then teleport into the room.
#   Arrival spot: stand inside the room where players should land, then
#   /vaultroom portaldest vault   (or: portalroom). Falls back to just inside
#   the room doorway if unset. Written as portal-dest.<id>.world/x/y/z/yaw.
#   Remove/redo any portal: /vaultroom portalremove <id>  (kills FX + holo),
#   then pos1/pos2 + /vaultroom portal <id> again.
# Regions are written here by the command (portals.vault / portals.portalroom).
#
# RETURN PORTALS (inside the rooms -> back to spawn):
#   Same pos1/pos2 flow, then:  /vaultroom portal vault_return
#                          or:  /vaultroom portal portalroom_return
# Green/gold FX (Home Portal theme). Stand inside 3s (step-out cancels
# instantly, blocked if monsters within 12 blocks, creative = instant)
# then teleport to the return point.
#   Set the destination by standing at spawn and running: /vaultroom returnspawn
# (falls back to world spawn if unset). Written as return-spawn.world/x/y/z/yaw.
