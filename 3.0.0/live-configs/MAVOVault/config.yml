# MAVOVault - paid-access rooms + personal vault chests
#
# SETUP (in-game, as OP):
#   1. Stand in one corner of the room/doorway zone:  /vaultroom pos1
#   2. Stand/fly to the OPPOSITE corner (cover full height): /vaultroom pos2
#   3. /vaultroom gate vault        (or: portalroom)
#   Repeat for the second room. The region is the KEEP-OUT zone: players
#   without access are bounced back and shown the unlock GUI.
#
# Prices are one-time. Change live with /vaultroom price <gate> <coins>.
gates:
  vault:
    price: 50000
  portalroom:
    price: 25000

# Price to CLAIM a private vault room (door + 15 chest slots). One room per player.
# Slot unlock ladder is fixed in the plugin: #1 FREE, #2-3 1000, #4-6 2500,
# #7-10 5000, #11-15 10000 (total 76,500 for a full room).
chest-price: 5000
# Fee to rename a vault chest (0 = free).
rename-price: 0
