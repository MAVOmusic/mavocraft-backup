# MAVOQuests v1.2 - random rotating quest board
#
# Every refresh-days MINECRAFT day(s) (default: DAILY), board-size quests are picked at RANDOM
# from the pool below (repeats across cycles are possible - it's random).
#
# REWARDS are rolled per completion using reward-weights:
#   coins-only : just the quest's reward-coins
#   item-only  : a random 1-64 stack of a random mystery item (no coins)
#   both       : coins AND a mystery stack
# The reward is a surprise revealed on turn-in.

refresh-days: 1
board-size: 10

reward-weights:
  coins-only: 40
  item-only: 30
  both: 30

# Pool for random mystery item stacks (amount rolled 1 to max stack, capped 64)
# Villager-economy pass: no DIAMOND / EMERALD / GOLDEN_APPLE / ENDER_PEARL -
# those bypass the villager + profession grind. Mystery = fun, not jackpot.
mystery-items:
  - GOLDEN_CARROT
  - IRON_INGOT
  - GOLD_INGOT
  - ARROW
  - COOKED_BEEF
  - BREAD
  - EXPERIENCE_BOTTLE
  - COAL_BLOCK
  - OAK_LOG
  - OBSIDIAN
  - LAPIS_LAZULI
  - REDSTONE
  - NAME_TAG
  - SADDLE
  - BOOK

