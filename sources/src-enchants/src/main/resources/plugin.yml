name: MAVOEnchants
version: 3.0.5
main: mavo.enchants.Enchants
api-version: '1.21'
description: "8 enchant gems (4 tool + 4 colored armor), /gemshop 2 pages, mining drops tiers 1-3"
author: MAVO
softdepend: [Vault]
commands:
  maenchant:
    description: "Enchant gems - list, charges, shop, or give (admin)"
    usage: /maenchant [list|charges|gem <player> <type> [tier]|shop]
  gemshop:
    description: "Buy enchant gems with coins - page 1 tool gems, page 2 armor gems (tier 1-10)"
    usage: /gemshop
permissions:
  mavoenchants.admin:
    description: Admin gem control (give gems)
    default: op
