name: MAVOEnchants
version: 1.0.0
main: mavo.enchants.Enchants
api-version: '1.21'
description: "Enchants: list / inspect; admin: gem give; gems buyable in /gemshop"
author: MAVO
softdepend: [Vault]
commands:
  maenchant:
    description: "Enchant gems - list, charges, shop, or give (admin)"
    usage: /maenchant [list|charges|gem <player> <type> [tier]|shop]
  gemshop:
    description: "Buy enchant gems with coins (tier 1-10, charges/cooldown in config)"
    usage: /gemshop
permissions:
  mavoenchants.admin:
    description: Admin gem control (give gems)
    default: op
