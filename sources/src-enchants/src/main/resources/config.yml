# MAVOEnchants - custom enchant gems
# Apply: hold the GEM in main hand and the TOOL in offhand, right-click (uses the gem).
# Up to 3 gems per tool, each type once, tier 1-4 (Hotfix 35: was 3).
max-gems-per-tool: 3
max-tier: 4
vein-blocks-per-tier: 6
lifesteal-hearts: 1
xpboost-percent-per-tier: 50

# ---- GEM SHOP (/gemshop) - Hotfix 35 ----
# Buy gems with coins (Vault). Price per tier - 1m / 2m / 4m / 8m ...
shop-enabled: true
shop-prices:
  1: 1000000
  2: 2000000
  3: 4000000
  4: 8000000

# ---- GEM DROPS FROM MINING - Hotfix 35 ----
# Mining ores can drop a RANDOM gem: 1% for tier 1, 0.5% tier 2, 0.25% tier 3,
# then half the chance on every level after (configurable below).
mine-gem-enabled: true
mine-gem-base-chance: 1.0    # % chance for a tier-1 gem
mine-gem-levels: 4           # how many tiers can drop (tier never exceeds max-tier)
