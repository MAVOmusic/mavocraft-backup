# MAVOEnchants - custom enchant gems
# Apply: hold the GEM in main hand and the item (tool or armor piece) in offhand,
# right-click (uses the gem). Up to 3 gems per item, each type once, tier 1-10.
# TOOL gems: VEIN / SMELT / XP / LIFESTEAL (emerald).
# ARMOR gems (different colors): AQUA (helmet, lapis) / AEGIS (chestplate, diamond) /
# MIGHT (leggings, amethyst) / FEATHER (boots, quartz). Shop page 2.
max-gems-per-tool: 3
max-tier: 10
vein-blocks-per-tier: 6
lifesteal-hearts: 1
xpboost-percent-per-tier: 50
smelt-bonus-per-tier: 10     # % chance per tier for a BONUS smelted item (T10 = 100%)

# ---- GEM CHARGES + COOLDOWN (Hotfix 37) ----
# Every gem level has a charge pool. The cooldown starts with the FIRST use and
# the pool refreshes when it ends (so L1: first use starts 10 min, you keep the
# other 9 uses, and at 10 min you are back to 10).
# uses: 0 + cooldown-minutes: 0 = UNLIMITED (level 10).
gem-charges:
  1:  { uses: 10, cooldown-minutes: 10 }
  2:  { uses: 5,  cooldown-minutes: 9 }
  3:  { uses: 10, cooldown-minutes: 8 }
  4:  { uses: 15, cooldown-minutes: 7 }
  5:  { uses: 20, cooldown-minutes: 6 }
  6:  { uses: 25, cooldown-minutes: 5 }
  7:  { uses: 30, cooldown-minutes: 4 }
  8:  { uses: 35, cooldown-minutes: 3 }
  9:  { uses: 50, cooldown-minutes: 2 }
  10: { uses: 0,  cooldown-minutes: 0 }

# ---- GEM SHOP (/gemshop) ----
# Buy gems with coins (Vault). Price per tier - 1M, 2M, 4M, 8M ... (doubling).
# Page 1 = tool gems, page 2 = armor gems. Mining drops tiers 1-3 only.
shop-enabled: true
shop-prices:
  1: 1000000
  2: 2000000
  3: 4000000
  4: 8000000
  5: 16000000
  6: 32000000
  7: 64000000
  8: 128000000
  9: 256000000
  10: 512000000

# ---- GEM DROPS FROM MINING (Hotfix 43) ----
# EXACT per-action odds - every ore mined is one roll:
#   tier 1 = 0.1%  (1 in 1,000)
#   tier 2 = 0.05% (1 in 2,000)
#   tier 3 = 0.01% (1 in 10,000)
# Only tiers 1-3 drop from ores (shop still sells up to 10). One gem max per ore.
drop-version: 2
mine-gem-enabled: true
mine-gem-max-tier: 3
mine-gem-chances:
  1: 0.1
  2: 0.05
  3: 0.01
