name: MAVOCrafting
version: 1.0.0
main: mavo.crafting.Crafting
api-version: '1.21'
description: Custom crafting recipes - craft the uncraftables (chainmail, name tag, saddle, lead) (MAVOcraft)
author: MAVO
commands:
