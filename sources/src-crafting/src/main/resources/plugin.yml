name: MAVOCrafting
version: 3.0.1
main: mavo.crafting.Crafting
api-version: '1.21'
description: Custom crafting recipes - craft the uncraftables (chainmail, name tag, saddle, lead) (MAVOcraft)
author: MAVO
commands:
  crafting:
    description: "List custom recipes (admin: reload); /craft opens the 50 basic beginner recipes for everyone"
    usage: /crafting [list|reload]
  craft:
    description: "Open the beginner recipe list (50 basic recipes) - open to everyone"
    usage: /craft [recipe]
permissions:
  mavocrafting.admin:
    description: Admin crafting control (reload)
    default: op
