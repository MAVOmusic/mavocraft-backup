    xp-growth: 1.035
    max-level: 999
    coin-bonus: 0.25
    enchant-pool: [efficiency, unbreaking, fortune, silk_touch]
    tiers:
      0: { tool: STONE_AXE, enchants: [] }
      10: { tool: IRON_AXE, enchants: ["efficiency:1"] }
      25: { tool: DIAMOND_AXE, enchants: ["efficiency:2", "unbreaking:1"] }
      50: { tool: NETHERITE_AXE, enchants: ["efficiency:3", "mending:1"] }
