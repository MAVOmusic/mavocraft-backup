# MAVOProfessions v3.0 - tool-bound professions with branches
#
# HOW IT WORKS
#  - Players START a profession by taking the free starter tool(s) from /profession.
#  - ONLY actions performed with a bound profession tool give XP.
#  - Level completion pauses XP until claimed in /profession; claiming upgrades
#    ALL of the profession's bound tools IN PLACE (fresh durability).
#  - Non-tier levels: enchant-chances table (40% early, tapering to 15%) per tool to gain ONE new enchant or +1
#    to an existing one. Enchants are cumulative and NEVER conflict (the game's
#    own conflict registry is consulted: Fortune/Silk, Mending/Infinity,
#    Multishot/Piercing, Sharpness/Smite/Bane, etc).
#  - branches: professions can have multiple tools (e.g. Fortune pick + Silk pick,
#    Bow + Crossbow). All branches level together on one claim. Each branch can
#    exclude enchants and add its own baseline bonuses at tier levels.
#  - Tier levels (10/25/50) replace tools with the next material and reset enchants
#    to tier baseline + branch bonus. Diamond+ baselines include Mending.
#  - Over-vanilla caps by tier: stone/iron = vanilla only; diamond = vanilla+1;
#    netherite/top = vanilla+2, plus +1 more per 50 levels past over-vanilla-level
#    (e.g. Efficiency cap 7 at Lv 30, 8 at Lv 100, 9 at Lv 150). Over-cap = Masterwork.
#    Single-level enchants (mending/silk touch/infinity) never exceed 1.
coin-bonus-chance: 0.10
# Chance to gain an enchant on claim, by level bracket (key = bracket upper bound)
enchant-chances:
  30: 0.22
  50: 0.20
  100: 0.18
  150: 0.15
  200: 0.12
  250: 0.10
  400: 0.08
# fallback if the table above is removed
enchant-chance: 0.40
over-vanilla-level: 100   # top-tier caps rise past this level
cap-step: 50             # +1 cap per this many levels past over-vanilla-level (netherite+)
xp-flatten-level: 400    # xp requirement stops growing at this level (keeps 999 humanly possible)

# Prestige sets (name + look changes on the bound tools):
#   Lv 250 = FLEXER SET (gold)   Lv 420 = YE MAN SET (rasta cycle)
#   Lv 666 = SATAN SET (red/black cycle)   Lv 999 = GOD SET (white/gold, 255 enchants)
# Console commands run when a player CLAIMS these levels (any profession):
rank-commands:
  250:
    - "lp user %player% parent add flex"
  420:
    - "lp user %player% parent add yeman"
  666:
    - "lp user %player% parent add satan"
  999:
    - "lp user %player% parent add god"

