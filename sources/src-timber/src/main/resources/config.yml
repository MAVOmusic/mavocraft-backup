# MAVOTimber - tree felling
enabled: true
# HOTFIX 35 + 39: anti-exploit + whole-tree fall. The WHOLE tree falls (no floating
# trunk stubs - tall spruce/dark-oak included), but at most max-logs are collected:
# trees shorter than the cap give their natural amount.
max-logs: 10                 # max logs DROPPED per tree (incl. the one you broke)
max-blocks: 200              # safety cap for the crown walk (whole tree still falls up to it)
axe-damage: true             # use ONE axe durability break per collected log (capped)
drop-all: true               # false = only the broken log drops (others vanish)
# Lumberjack profession XP (via MAVOProfessions reflection), capped per tree.
xp-per-log: 0.5              # XP per collected log
xp-cap-per-tree: 10          # max profession XP per tree (anti-exploit)
# Leaves: after the trunk falls the crown decays and drops saplings/sticks.
leaves-fall: true
leaves-max: 750              # safety cap on leaves processed per tree
# HOTFIX 36: fell GROWN TREES only. A cluster of logs only falls when its
# connected component contains leaves (a real tree crown) AND no player-placed
# logs/leaves. Shipwrecks, village houses and player log builds are never felled.
natural-trees-only: true
