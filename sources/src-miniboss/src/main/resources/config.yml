# MAVOMiniboss - rare biome bosses
spawn-interval-minutes: 45
max-alive: 3
spawn-min-distance: 1000     # from spawn (-2579,-1685)
spawn-max-distance: 5000
spawn-surface: true          # only on the surface (y>50)

# ---- /hunt (Hotfix 35 + 42) ----
# Players can't reach the wild from spawn except the Wild Portal - /hunt teleports
# them out. With a boss alive you land ~200 blocks from it (not 1000 - too far to walk).
hunt-enabled: true
hunt-cooldown-seconds: 30
hunt-boss-radius: 200         # land within this distance of a live boss
hunt-bare-min: 500            # no boss alive: at least this far from world spawn
hunt-bare-max: 2000

# ---- Boss location chat broadcast (Hotfix 35) ----
broadcast-locations: true
broadcast-interval-minutes: 5
broadcast-radius: 100        # shown in chat as "around x, z (±100 blocks)"

# ---- Boss difficulty + drop pool (Hotfix 42) ----
# Spawn broadcasts announce the drop pool in % (lucky-chance / crate-chance) and
# the boss HP before the callout. Chances are rolled independently on kill.
bosses:
  swamp_witch_lord:
    name: "&5&lSWAMP WITCH LORD"
    entity: WITCH
    hp: 800
    coins: 50000
    lucky-coins: 3
    lucky-chance: 60
    crate-key: "rare"
    crate-keys: 1
    crate-chance: 50
    head: PLAYER_HEAD
