# MAVOMiniboss - arena bosses (Hotfix 44: 15 boss types, 2 fixed spawn locations)
spawn-interval-minutes: 45
max-alive: 3
spawn-surface: true          # only on the surface (y>50)

# ---- SPAWN LOCATIONS (Hotfix 44) ----
# Bosses no longer appear at random wild spots - they spawn at THESE arenas.
# Each entry: name (chat color), world, center x/z and jitter (random offset
# around the center, in blocks). Change values here, then /miniboss reload
# (OP) - no code edit needed. Jitter 0 = always the exact center.
spawn-locations:
  - name: "&4&lNORTHERN ARENA"
    world: world
    x: -2700
    z: 560
    jitter: 120
  - name: "&6&lSOUTHERN ARENA"
    world: world
    x: 340
    z: 1470
    jitter: 120

# ---- /hunt (Hotfix 35 + 42) ----
# Players can't reach the wild from spawn except the Wild Portal - /hunt teleports
# them out. With a boss alive you land ~200 blocks from it (not 1000 - too far to walk).
hunt-enabled: true
hunt-cooldown-seconds: 30
hunt-boss-radius: 200         # land within this distance of a live boss
hunt-bare-min: 500            # no boss alive: at least this far from world spawn
hunt-bare-max: 2000

# ---- Boss location chat broadcast (Hotfix 35) ----
broadcast-locations: true
broadcast-interval-minutes: 5
broadcast-radius: 100        # shown in chat as "around x, z (±100 blocks)"

# ---- Boss difficulty + drop pool (Hotfix 42 + 44) ----
# Spawn broadcasts announce the drop pool in % (lucky-chance / crate-chance) and
# the boss HP before the callout. Chances are rolled independently on kill.
# Hotfix 44: NETHER OVERLORD matches the live production values (150k / 6x @50% /
# 3x Mythic @50% / 2000 HP) and 10 NEW bosses join the roster (15 total).
