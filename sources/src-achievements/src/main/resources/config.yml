# MAVOAchievements - progression categories
#
# Each category levels up when your lifetime count reaches:
#   threshold(level) = base * growth ^ (level - 1)
#
# REBALANCED v1.1: max-level 100, requirements halved, growth softened to 1.10
# so level 100 is actually reachable in a lifetime of grinding
# (growth 2.0 at 100 levels would need more blocks than exist in the world).
#   mining: L1=500, L10=1.2k, L25=5.4k, L50=53k, L75=573k, L100=6.2M
#
# Logs now count to WOODCUTTING, not mining.
#
# Every reward-every levels the player gets:
#   coins = milestone-coins * level      (e.g. 400 * level 10 = 4,000)
#   plus every command in milestone-commands (%player%, %level%, %category%)
#
# Level-ups print ONE chat line to the player only. Milestones broadcast. No popup spam.

reward-every: 5

