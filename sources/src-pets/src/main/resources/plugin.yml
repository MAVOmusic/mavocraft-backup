name: MAVOPets
version: 2.0.0
main: mavo.pets.Pets
api-version: '1.21'
description: Pets 2.0 - companions with abilities: carry a stack, attract XP orbs, level up (MAVOcraft)
author: MAVO
softdepend: [Vault]
commands:
  pets:
    description: "Open the pet shop"
    usage: /pets
  pet:
    description: "Your active pet: menu / recall / xp (admin: give)"
    usage: /pet [menu|recall|xp]
permissions:
  mavopet.admin:
    description: Admin pet control (give)
    default: op
