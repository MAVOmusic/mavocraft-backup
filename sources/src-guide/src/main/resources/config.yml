      - "&7  &a+15% &7with the L1000 &c\u2660&f\u2665 Blaze of Fate &c\u2666&f\u2663"
      - ""
      - "&c\u26A0 The house edge is real. Never bet the rent."
  - name: "&d&lThe Museum"
    icon: WRITABLE_BOOK
    lines:
      - "&7Find &d&l\u2726 THE CURATOR \u2726 &7at spawn. She wants"
      - "&7ONE of every item in the game for her museum."
      - ""
      - "&7~90 exhibit sections: helmets, pants, flowers,"
      - "&7music discs, ores, mob heads... 1,300+ items."
      - ""
      - "&7Two ways to donate:"
      - "&71. Click a grey item in an exhibit - takes 1"
