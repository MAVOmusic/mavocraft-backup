# ---------------- step-by-step tutorial chapters ----------------
tutorial:
  - name: "&c&lSpawn Tavern"
    icon: RED_BED
    lines:
      - "&7Need to skip the night without leaving the plaza?"
      - "&7Right-click the &cTavern bed&7 at spawn."
      - "&7Costs &e100 \u26C3&7, works at night only."
      - "&7Then it locks for you until &enoon&7 - one rest each night."
  - name: "&a&lYour First Steps"
    icon: OAK_SAPLING
    lines:
      - "&7You spawn at the &fsky plaza&7. Look around:"
      - "&7portals, trader stalls and the wishing well."
      - ""
      - "&71. Read the signs above the two portals"
      - "&72. When ready, step into the &c&lWILD PORTAL"
      - "&7   and stand still for 3 seconds"
      - "&73. You'll be flung 2,000-5,000 blocks out"
      - "&7   into untouched wilderness. &cNo way back!"
      - ""
      - "&7Want a fresh wild spot later? Come BACK to spawn"
      - "&7and use the portal again (5 min cooldown)."
  - name: "&2&lSurvive & Grind"
    icon: IRON_PICKAXE
    lines:
      - "&7Punch trees, build a shelter - classic start."
      - "&7Then open &e/prof &7and pick professions:"
      - ""
      - "&7Each gives you a &fBOUND TOOL&7. Only grinding"
      - "&7with bound tools earns profession XP."
      - "&7Level up = better tools + enchants (up to L999)."
      - ""
      - "&7Everything you do also counts toward &e/ach"
      - "&7achievements - lifetime milestones + pocket money."
      - ""
      - "&c\u26A0 Only SURVIVAL mode progress counts!"
  - name: "&e&lEarn Coins"
    icon: SUNFLOWER
    lines:
      - "&7Coins (&e\u26C3&7) are the server currency. Sources:"
      - ""
      - "&7- &fProfessions &7- coin bonus per action"
      - "&7- &fDaily quests &7- &e/quest &7(10 fresh per day)"
      - "&7- &fAchievements &7- milestone rewards"
      - "&7- &fLogin streaks &7- &e/streak"
      - "&7- &fSelling raw materials &7- &e/shop &7or &e/sell hand"
      - ""
      - "&7The shop is EXPENSIVE on purpose - villager"
      - "&7trading is the smart way to gear up!"
  - name: "&2&lVillagers = Progression"
    icon: EMERALD
    lines:
      - "&7This server is a &fvillager-first economy&7:"
      - ""
      - "&71. Farm crops, trade to farmers for emeralds"
      - "&72. Cure zombie villagers for discounts"
      - "&73. Build a trading hall with librarians & smiths"
      - "&74. Buy gear with emeralds, not coins"
      - ""
      - "&7Master Traders at spawn take emeralds for"
      - "&7premium stock (Mending books, templates...)."
      - "&7Check wandering traders - only useful items now!"
  - name: "&a&lClaim Your Land"
    icon: GRASS_BLOCK
    lines:
      - "&7Protect your base with chunk claims:"
      - ""
      - "&e/chunk claim &7- claim the chunk you stand in"
      - "&7First chunk is &aFREE&7, prices rise in tiers."
      - "&7Max 51 chunks per player."
      - ""
      - "&e/chunk access <player> &7- let a friend build"
      - "&e/chunkprice &7- price tiers and your progress"
      - "&e/borders &7- toggle the red/blue border display"
      - ""
      - "&7A 1-chunk buffer around your claim stops"
      - "&7strangers from building right at your edge."
  - name: "&9&lHome & Travel"
    icon: RED_BED
    lines:
      - "&7Homes are bound to beds in YOUR claimed chunks:"
      - ""
      - "&71. Claim a chunk, place a bed, right-click it"
      - "&72. &e/home &7teleports you back (renameable)"
      - ""
      - "&7The &a&lHOME PORTAL &7at spawn also takes you"
      - "&7to your first home. &e/spawn &7returns to spawn."
      - ""
