features:
  - id: professions
    icon: IRON_PICKAXE
    name: "&c&lProfessions"
    short: "Level 10 professions by grinding with bound tools"
    info:
      - "&7Long-haul grind: iron@10, diamond@25, netherite@50."
      - "&710 professions: Lumberjack, Miner, Excavator, Farmer,"
      - "&7Hunter, Archer, Fisherman, Guardian, &6Gambler &7and &dSleeper&7."
      - "&7Grind with your BOUND tool to earn XP. Tier rewards:"
      - "&7Stone > Iron (L10) > Diamond (L25) > Netherite (L50),"
      - "&7then enchant upgrades all the way to level 999."
      - "&7Prestige: &fFLEXER 250 &7> &aYE MAN 420 &7> &cSATAN 666 &7> &6GOD 999"
      - ""
      - "&6\u2660 Gambler &7is special: XP comes from BETTING at"
      - "&7Lucky Louie's, while holding your bound lucky stick."
      - "&7The stick adds WIN LUCK - up to +15% at level 1000."
      - ""
      - "&dSleeper &7is special too: XP from sleeping at night -"
      - "&7hearts + Lucky Coins every 10 levels, rank at L100."
      - ""
      - "&e/prof &7- menu (each icon shows a full deep-dive)"
      - "&e/prof top <profession> &7- leaderboards"
  - id: museum
    icon: WRITABLE_BOOK
    name: "&d&lThe Museum"
    short: "103 exhibits / 1,413 items - buy what you miss, per player"
    info:
      - "&7The Curator catalogues EVERYTHING. Donate one of"
      - "&7every obtainable item - &f1,413 &7across"
      - "&f103 exhibit sections."
      - ""
      - "&7Green &a\u2714 &7= exhibited, grey = missing. Complete a"
      - "&7section and earn &e1,000 \u26C3 per item &7in it - the"
      - "&7Pants exhibit (7) pays 7,000, Music Discs pay big!"
      - ""
      - "&7Donate by clicking grey items, or open the"
      - "&aDeposit Crate&7, dump your haul, close it."
      - "&7Duplicates and custom/bound items bounce back."
      - "&7Missing items are buyable in &e/museum > Museum Extras&7 -"
      - "&7per player, normal shop prices, buy only."
      - ""
      - "&7Ranks: &f25% &7/ &f50% &7/ &f75% &7/ &6100% THE CURATOR"
      - "&7Each pays a coin bonus + a chat title."
      - ""
      - "&e/museum &7- your collection book."
  - id: vaultrooms
    icon: GOLD_BLOCK
    name: "&6&lThe Vault - Private Rooms"
    short: "96 private lockable rooms, 6 floors"
    info:
      - "&6\u2666 THE VAULT &7- &e50,000 \u26C3 &7one-time entry."
      - "&7Enter via the black plaza portal (3s countdown)."
      - ""
      - "&7Inside: &f6 floors&7, ladders at both ends,"
      - "&f96 private rooms&7 in gold, diamond, emerald,"
      - "&7netherite... each with a door + 15 double chests."
      - ""
      - "&fClaim a room: &e5,000 \u26C3 &7- right-click any"
      - "&7unclaimed door. Your name on the sign, only YOUR key."
      - ""
      - "&fChest slots &7unlock one by one:"
      - "&7#1 &aFREE &8| &7#2-3 &e1,000 &8| &7#4-6 &e2,500"
      - "&7#7-10 &e5,000 &8| &7#11-15 &e10,000"
      - "&7Right-click a sealed chest to unlock the next slot."
      - "&7Each unlocked chest gets a &fsign&7: sneak-click to"
      - "&7rename it and pick a &ccolour&7."
      - ""
      - "&aMulti-room: &7fill ALL 15 chests, then claim another"
