      - "&c   Monsters within 12 blocks BLOCK the teleport -"
      - "&c   you cannot teleport out of a fight!"
  - name: "&6&lLucky Coins & Wishes"
    icon: GOLD_NUGGET
    lines:
      - "&7Mining, fighting and fishing have a 1% chance"
      - "&7to drop a &6\u26C0 Lucky Coin&7."
      - ""
      - "&7Take it to the &bWishing Well &7at spawn and"
      - "&7toss it in with &eQ&7. A random prize appears:"
