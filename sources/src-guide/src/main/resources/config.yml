      - "&7~18% enchanted gear (from the shop gear list)."
      - "&cNo netherite blocks/ingots from the well."
      - ""
      - "&e/ccollect &7- free coin every 10 in-game days"
  - name: "&d&lDying & Graves"
    icon: CHEST
    lines:
      - "&7When you die, your items go into a locked"
      - "&7grave chest only YOU can open."
      - ""
