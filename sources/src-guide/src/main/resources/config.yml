      - "&7bursts open for anyone to loot."
      - ""
      - "&e/grave &7- see where your graves are"
      - ""
      - "&7Tip: sleep at your bed so night doesn't kill"
      - "&7your villagers - watch the HUD clock!"
  - name: "&6&lLucky Louie (10 games, coin+lucky attempts)'s Casino"
    icon: GOLD_NUGGET
    lines:
      - "&7Find &c&l\u2663 LUCKY LOUIE \u2660 &7at spawn and"
      - "&7right-click him to gamble... if you dare."
      - ""
      - "&75 games: &fPick a Cup&7, &fCoin Flip&7, &fDice Duel&7,"
      - "&fCrystal Wheel &7and &fTNT Tiles &7(cash out or boom)."
      - ""
      - "&7Bet &e\u26C3 coins &7(100-5,000) or &6\u26C0 Lucky Coins &7(1-10)."
      - "&7You get &f10 attempts &7every &f10 MC days&7."
      - ""
      - "&6\u2660 Pro tip: &7start the &6Gambler &7profession in &e/prof&7."
      - "&7HOLD your bound lucky stick while betting:"
      - "&7- every bet earns Gambler XP"
