# MAVOMobFarm 2.6.2 — unique per-mob bays @ -15000 (each mob gets its own kill cell)
entry-cost: 10000
entry-cancel-seconds: 10
session-minutes: 15
# /mobfarm extend: +15 min on the SAME session timer (endsAt + HUD countdown)
extend-cost: 25000
extend-minutes: 15
profession-xp-scale: 0.30
pvp: false

mob-ai: true
sun-safe-killpad: true
credit-last-damager: true
session-hud: true
session-hud-title: "&6MobFarm &7| &e{mm}:{ss} &7left &8| &f{mob} &8| &ex{stack}"

# Protection ONLY this far around the farm AABB (caves outside = normal)
protect-radius: 50

# Pricing — the table below is documentation; 2.6.1+ EMBEDS the same prices in code
# (config may override, but missing values can never fall back to the old flat P/16 = 625).
# pick (unlock a mob zone) = that mob's REAL shop spawner buy price / 16
#   (zombie 1,200,000 → 75,000); each ADDITIONAL pick in the same session DOUBLES
#   (75,000 → 150,000 → 300,000 …). Prices below mirror EconomyShopGUI shop/Mobs/spawners.yml.
# Mobs with no shop spawner use a class-equivalent fallback (closest existing price).
# extra spawner stacks on the SAME block use the mob price too: /8, /4, /2, ×1 then double.
normal-spawner-price: 10000          # fallback only for mobs missing below
unlock-divisor: 16
extra-divisors: [8, 4, 2, 1]   # first four stack extras; then doubles previous
shop-buy:                     # entity-name -> shop spawner buy price (coins)
  ZOMBIE: 1200000
  HUSK: 1250000
  SKELETON: 1250000
  STRAY: 1250000
  SPIDER: 450000
  CAVE_SPIDER: 500000
  CREEPER: 1500000
  ENDERMAN: 1750000
  BLAZE: 1250000
  MAGMA_CUBE: 5000000
  SLIME: 5500000
  WITHER_SKELETON: 2500000
  DROWNED: 1200000
  GUARDIAN: 2500000
  WITCH: 5000000
  PILLAGER: 1750000
  HOGLIN: 1200000
  PIGLIN: 1200000
  SILVERFISH: 500000
  PHANTOM: 2500000
  COW: 1000000
  PIG: 1000000
  CHICKEN: 150000
  SHEEP: 450000
  RABBIT: 450000
  VILLAGER: 1000000
  IRON_GOLEM: 10000000
  SQUID: 1000000
  GLOW_SQUID: 1000000
  BEE: 150000
  FOX: 250000
  GOAT: 1200000
  LLAMA: 450000
  PANDA: 500000
  FROG: 3950000
  SNIFFER: 450000
base-spawners: 2
max-spawners: 25
stack-spawn-interval-ticks: 40
spawn-per-stack: 1
max-mobs-in-cell: 12

# NEW remote hub — far west of plaza/vault (~-4000)
center:
  world: world
  x: -15000
  y: 200
  z: -2000

# Wings: hostile west (−X), animals east (+X but still ≪ vault)
# Each mob is its own bay — offsets from center
# style: pad | feet | spider | enderman | blaze | slime | water | pen | raid | nether

community:
  enabled: true
  start-target: 1000000
  stack-start: 2

# Blacklist: no wild/portal dump into these boxes (walk + /spawn OK)
# /mobfarm enter and admin tp bypass
blacklist:
  enabled: true
  regions:
    plaza:
      world: world
      min: { x: -4120, y: 150, z: -2120 }
      max: { x: -3880, y: 250, z: -1880 }
    vault:
      world: world
      min: { x: -4120, y: 150, z: -2120 }
      max: { x: -3880, y: 260, z: -1880 }
    portal:
      world: world
      min: { x: -4100, y: 150, z: -2100 }
      max: { x: -3900, y: 250, z: -1900 }
    # mobfarm filled at runtime from built AABB + protect-radius

