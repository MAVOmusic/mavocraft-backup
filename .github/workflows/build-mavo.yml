name: Build MAVO plugins

# Builds the MAVO plugin sources with JDK 25 and commits the resulting jars
# straight back into the repo (root + jars/). Trigger by pushing to a branch,
# or manually with "Run workflow". Same-branch pushes do not re-trigger this
# workflow (it only watches sources/** and workflow files).
on:
  push:
    branches: [ 'arena/**' ]
    paths:
      - 'sources/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build all plugins
        run: |
          set -eo pipefail
          fail=0
          for d in sources/src-*; do
            echo "== Building $d =="
            (cd "$d" && mvn -B package -DskipTests) || fail=1
          done
          ls -la sources/*/target/*.jar 2>/dev/null || true
          if [ "$fail" = 1 ]; then
            echo "AT LEAST ONE PLUGIN FAILED TO BUILD"
            exit 1
          fi

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "mavocraft-ci"
          git config user.email "ci@mavocraft.local"
          {
            echo "## build log $(date -u)"
            for d in sources/src-*; do
              echo "== $d =="
              (cd "$d" && mvn -B package -DskipTests) 2>&1 || true
            done
          } > build.log
          git add build.log
          git commit -m "ci: publish build log (failure)" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

      - name: Copy jars to repo root + jars/
        run: |
          set -euo pipefail
          mkdir -p jars
          for f in sources/*/target/MAVO*.jar; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              *original-*|*-sources.jar|*-javadoc.jar) continue;;
            esac
            cp -f "$f" .
            cp -f "$f" jars/
          done
          # remove superseded versions of rebuilt plugins (keep latest only)
          rm -f MAVOGuide-2.5.*.jar MAVOGuide-2.6.0.jar MAVOGuide-2.7.*.jar jars/MAVOGuide-2.5.*.jar jars/MAVOGuide-2.6.0.jar jars/MAVOGuide-2.7.*.jar
          rm -f MAVOEvents-1.1.0.jar jars/MAVOEvents-1.1.0.jar
          rm -f MAVOLuckyCoins-1.5.[0-5].jar jars/MAVOLuckyCoins-1.5.[0-5].jar
          rm -f MAVODeathChest-1.0.*.jar jars/MAVODeathChest-1.0.*.jar
          rm -f MAVOAchievements-1.7.0.jar MAVOAchievements-1.7.1.jar jars/MAVOAchievements-1.7.0.jar jars/MAVOAchievements-1.7.1.jar
          rm -f MAVOProfessions-3.13.0.jar MAVOProfessions-3.14.0.jar jars/MAVOProfessions-3.13.0.jar jars/MAVOProfessions-3.14.0.jar
          rm -f MAVOProfessions-3.15.[0-4].jar jars/MAVOProfessions-3.15.[0-4].jar
          rm -f MAVOWanderer-1.0.0.jar jars/MAVOWanderer-1.0.0.jar
          rm -f MAVOCurator-1.0.[0-5].jar jars/MAVOCurator-1.0.[0-5].jar
          rm -f MAVOWild-1.7.3.jar jars/MAVOWild-1.7.3.jar
          rm -f MAVOShopNPC-1.3.2.jar jars/MAVOShopNPC-1.3.2.jar
          rm -f MAVOCasino-1.2.[0-3].jar jars/MAVOCasino-1.2.[0-3].jar
          rm -f MAVOMobFarm-2.[0-5].*.jar jars/MAVOMobFarm-2.[0-5].*.jar
          rm -f MAVOAuctionHouse-1.0.[0-3].jar jars/MAVOAuctionHouse-1.0.[0-3].jar
          rm -f MAVOPets-1.0.0.jar jars/MAVOPets-1.0.0.jar
          ls -la MAVO*.jar | tail -40

      - name: Verify MAVOPortalRoom class (javap + prices)
        run: |
          set -euo pipefail
          javap -v -classpath MAVOPortalRoom-1.2.0.jar mavo.portalroom.PortalRoom > /dev/null
          unzip -p MAVOPortalRoom-1.2.0.jar mavo/portalroom/PortalRoom.class | strings | grep -q "|500000|"
          unzip -p MAVOPortalRoom-1.2.0.jar mavo/portalroom/PortalRoom.class | strings | grep -q "|5000000|"
          echo "MAVOPortalRoom class OK (javap + prices)"

      - name: Upload rebuilt jars (backup if the bot push is blocked)
        uses: actions/upload-artifact@v4
        with:
          name: mavo-rebuilt-jars
          path: |
            MAVO*.jar
            jars/*.jar
          if-no-files-found: error

      - name: Diagnose bot push (empty commit test)
        run: |
          git config user.name "mavocraft-ci"
          git config user.email "ci@mavocraft.local"
          git commit --allow-empty -m "ci: push probe $(date -u +%s)"
          ERR=/tmp/probe.err
          if git push origin HEAD:"${GITHUB_REF_NAME}" 2>"$ERR"; then
            echo "::notice::empty push OK - ref update works"
          else
            echo "::error::empty push FAILED - $(tr '\n' ' ' < "$ERR" | head -c 600)"
            exit 0
          fi

      - name: Commit rebuilt jars
        run: |
          git config user.name "mavocraft-ci"
          git config user.email "ci@mavocraft.local"
          git add -A 'MAVO*.jar' jars/
          if git diff --cached --quiet; then
            echo "No jar changes to commit"
            exit 0
          fi
          git commit -m "ci: rebuilt plugin jars"
          ERR=/tmp/jarpush.err
          if git push origin HEAD:"${GITHUB_REF_NAME}" 2>"$ERR"; then
            echo "jar commit pushed"
          else
            # Bot push blocked (branch moved / token limits): the built jars are
            # still available as the 'mavo-rebuilt-jars' artifact - commit them
            # manually. Keep the run green so the artifact is not lost.
            echo "::warning::jar push failed - $(tr '\n' ' ' < "$ERR" | head -c 600)"
            exit 0
          fi
